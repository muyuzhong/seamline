name: Feature Request / 功能建议
description: Propose a storage adapter, protocol enhancement, or SDK capability for Seamline
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement to **Seamline**! Please check [existing issues](https://github.com/muyuzhong/seamline/issues) and [`docs/ARCHITECTURE.md`](https://github.com/muyuzhong/seamline/blob/main/docs/ARCHITECTURE.md) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem or AI streaming use case / 业务场景与痛点
      description: What production AI/LLM streaming problem are you solving? Focus on the end goal first.
      placeholder: |
        Example: When an AI agent invokes 3 tool calls in parallel within one session, we need concurrent stream_id multiplexing...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior & wire/API surface / 期望行为与接口设计
      description: Describe the ideal HTTP/SSE API, `storage.Storage` contract, or CLI flags.
      placeholder: |
        GET /v1/sessions/{id}/stream -> ...
      render: text
    validations:
      required: false

  - type: textarea
    id: invariants
    attributes:
      label: Impact on Dual-Speed invariants & dependencies / 对核心不变量与零依赖约束的影响
      description: Does this affect zero-gap `Last-Event-ID` recovery, single-record compaction, lock ordering, or `go.mod` dependencies?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 备选方案
      description: Any workarounds or alternative designs you evaluated?
    validations:
      required: false
