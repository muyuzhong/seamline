name: Bug Report / 缺陷报告
description: Report a bug, race condition, or SSE stream recovery issue in Seamline
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **Seamline**! Please fill out the details below.
        > **Security Note:** Do **not** report security vulnerabilities here. Use [GitHub Private Security Advisories](https://github.com/muyuzhong/seamline/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: |
        Clearly describe the unexpected behavior, error response, race report, or stream discrepancy (missing/duplicated delta or offset).
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 最小复现步骤
      description: Minimal commands (`curl`, `simworker`, Go test, or Live Playground steps) to reproduce the bug.
      placeholder: |
        1. Start server: `go run ./cmd/seamline --addr :8080`
        2. Publish chunk `seq=1..N` via `POST /v1/sessions/s1/events`
        3. Reconnect with `Last-Event-ID: <epoch>:1`
        4. Observe: ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected subsystem / 涉及模块
      options:
        - "internal/broker (Dual-speed sessionActor, Subscribe handoff, sweeper)"
        - "internal/storage (Storage interface / MemoryStorage / WAL)"
        - "internal/server (HTTP REST / SSE wire framing)"
        - "internal/server/demo.html (Embedded Live Playground)"
        - "cmd/seamline or cmd/simworker (CLI binaries)"
        - "CI / Linter / Build tooling"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Go version, OS & Commit SHA / 运行环境与版本
      description: "Output of `go version`, `uname -orsm`, and `git rev-parse --short HEAD`."
      placeholder: "e.g., go1.23.6 linux/amd64, Ubuntu 24.04, commit a1b2c3d"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, SSE frames, or `-race` stack trace / 日志或帧追踪
      description: Paste relevant server logs, raw `curl -N` SSE frames, or `go test -race` output (redact any secrets).
      render: text
    validations:
      required: false
